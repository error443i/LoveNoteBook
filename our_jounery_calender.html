<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Memories</title>
    <!-- Google Font Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
    <style>
        :root{
            --bg1: #ffe6e6;
            --bg2: #f9e2db;
            --bg3: #ffd1ff;
            --card-bg: #f5e2c8;
            --text: #4a4a4a;
        }

        html,body{
            height:100%;
            margin:0;
            padding:0;
        }

        body {
            background: linear-gradient(120deg, var(--bg1), var(--bg2), var(--bg3));
            background-size: 400% 400%;
            animation: romanticFlow 20s ease infinite;
            color: var(--text);
            font-family: "Karla", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            box-sizing: border-box;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            line-height:1.2;
        }

        @keyframes romanticFlow{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        .page {
            max-width:1200px;
            margin:18px auto;
            padding:16px;
        }

        h1 {
            text-align: center;
            font-size: clamp(18px, 3.5vw, 26px);
            margin:8px 0 18px;
            font-weight:700;
        }

        /* Fixed 4 columns on large screens to create an exact 4x3 layout (12 items total)
           with responsive fallbacks for narrower viewports. */
        .container {
            display: grid;
            grid-template-columns: repeat(4, minmax(140px, 1fr)); /* 4 columns */
            gap: 16px;
            align-items: start;
            justify-items: center;
            padding: 8px;
        }

        .photo-container {
            width:100%;
            max-width:260px;
            background-color: var(--card-bg);
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .photo-container:focus-within,
        .photo-container:hover{
            transform: translateY(-4px);
            box-shadow: 0 14px 30px rgba(0,0,0,0.18);
        }

        .photo-container img {
            width:100%;
            height:auto; /* preserve aspect ratio */
            max-height:260px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            display:block;
        }

        .month-label {
            display:block;
            margin-top:10px;
            font-size: clamp(13px, 2.2vw, 15px);
            font-weight:700;
            color:var(--text);
        }

        /* Fullscreen modal */
        .fullscreen-modal {
            display: none; /* toggled via JS */
            position: fixed;
            inset:0; /* top:0; right:0; bottom:0; left:0; */
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .fullscreen-modal[aria-hidden="false"]{
            display:flex;
        }

        .fullscreen-modal img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        /* Close button */
        .modal-close {
            position: absolute;
            top: 18px;
            right: 18px;
            background: rgba(255,255,255,0.06);
            color: #fff;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
            cursor:pointer;
            font-size:16px;
        }

        .visually-hidden{
            position:absolute!important;
            height:1px;width:1px;
            overflow:hidden;
            clip:rect(1px,1px,1px,1px);
            white-space:nowrap;
        }

        /* Responsive fallbacks: 3 / 2 / 1 columns */
        @media (max-width:1024px){
            .container{ grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width:768px){
            .container{ grid-template-columns: repeat(2, 1fr); }
            .photo-container img{ max-height:220px }
        }

        @media (max-width:420px){
            .container{ grid-template-columns: repeat(1, 1fr); gap:12px }
            .photo-container{padding:8px}
            .photo-container img{max-height:200px}
        }

    </style>
</head>

<body>
    <main class="page">
        <h1>Our Memories</h1>

        <section class="container" aria-label="Monthly photos">

            <figure class="photo-container">
                <img src="asset/calender/jan.JPG" alt="January calendar photo" loading="lazy"/>
                <figcaption class="month-label">Jan</figcaption>
            </figure>

            <figure class="photo-container">
                <img src="asset/calender/feb.JPG" alt="February calendar photo" loading="lazy"/>
                <figcaption class="month-label">Feb</figcaption>
            </figure>

            <figure class="photo-container">
                <img src="asset/calender/march.JPG" alt="March calendar photo" loading="lazy"/>
                <figcaption class="month-label">March</figcaption>
            </figure>

            <figure class="photo-container">
                <img src="asset/calender/april.JPG" alt="April calendar photo" loading="lazy"/>
                <figcaption class="month-label">April</figcaption>
            </figure>

            <figure class="photo-container">
                <img src="asset/calender/may.JPG" alt="May calendar photo" loading="lazy"/>
                <figcaption class="month-label">May</figcaption>
            </figure>

            <figure class="photo-container">
                <img src="asset/calender/jun.JPG" alt="June calendar photo" loading="lazy"/>
                <figcaption class="month-label">June</figcaption>
            </figure>

            <figure class="photo-container">
                <img src="asset/calender/july.JPG" alt="July calendar photo" loading="lazy"/>
                <figcaption class="month-label">July</figcaption>
            </figure>

            <figure class="photo-container">
                <img src="asset/calender/august.JPG" alt="August calendar photo" loading="lazy"/>
                <figcaption class="month-label">Aug</figcaption>
            </figure>

            <figure class="photo-container">
                <img src="asset/calender/sep.JPG" alt="September calendar photo" loading="lazy"/>
                <figcaption class="month-label">Sept</figcaption>
            </figure>

            <figure class="photo-container">
                <img src="asset/calender/oct.JPG" alt="October calendar photo" loading="lazy"/>
                <figcaption class="month-label">Oct</figcaption>
            </figure>

            <figure class="photo-container">
                <img src="asset/calender/nov.JPG" alt="November calendar photo" loading="lazy"/>
                <figcaption class="month-label">Nov</figcaption>
            </figure>

            <figure class="photo-container">
                <img src="asset/calender/dec.JPG" alt="December calendar photo" loading="lazy"/>
                <figcaption class="month-label">Dec</figcaption>
            </figure>

        </section>

        <div class="fullscreen-modal" id="fullscreenModal" aria-hidden="true" role="dialog" aria-label="Image preview">
            <button class="modal-close" id="modalClose" aria-label="Close preview">✕</button>
            <img id="modalImage" src="" alt="Full view" />
        </div>

    </main>

    <script src="script.js" defer></script>
</body>

</html>
